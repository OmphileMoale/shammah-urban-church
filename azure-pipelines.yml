trigger:
  - main

pool:
  vmImage: ubuntu-24.04

steps:
  - script: |
      command -v php || sudo apt-get install -y php-cli
      php -v
    displayName: Make sure PHP is available

  - script: |
      find . -name "*.php" -print0 | xargs -0 -n1 php -l
    displayName: Check every PHP file for syntax errors

  - task: CopyFiles@2
    displayName: Collect website files
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: |
        **/*.php
        **/*.sql
        css/**
        js/**
        assets/**
        includes/**
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  - task: PublishBuildArtifacts@1
    displayName: Publish website build
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'shammah-website'