# Azure Pipelines: automated build and test for the CMES website
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      php --version
      python3 --version
    displayName: 'Show tool versions'

  # BUILD: every PHP file must compile without syntax errors
  - script: |
      set -e
      find . -name "*.php" -print0 | xargs -0 -n1 php -l
    displayName: 'Build: PHP syntax check (php -l)'

  # TEST 1: every table has 10+ records, passwords are bcrypt hashes
  - script: python3 tests/check_database.py
    displayName: 'Test: database tables and seed data'

  # TEST 2: nav links, role guard, CSRF, password hashing, login lockout
  - script: python3 tests/check_site.py
    displayName: 'Test: site structure and security checks'
