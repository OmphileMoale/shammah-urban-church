<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C1A47"/>
      <stop offset="100%" stop-color="#3D0C2F"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Collar / clerical shirt -->
  <ellipse cx="100" cy="200" rx="80" ry="50" fill="#2a0820"/>
  <rect x="40" y="155" width="120" height="60" fill="#1a0614"/>
  <!-- Clerical collar white tab -->
  <rect x="88" y="148" width="24" height="18" rx="3" fill="white"/>
  <!-- Neck -->
  <rect x="84" y="130" width="32" height="30" rx="4" fill="#8B5E52"/>
  <!-- Head -->
  <ellipse cx="100" cy="105" rx="42" ry="48" fill="#7A5044"/>
  <!-- Hair (close-cropped dark) -->
  <ellipse cx="100" cy="68" rx="42" ry="18" fill="#1a0614"/>
  <!-- Ears -->
  <ellipse cx="58" cy="108" rx="7" ry="9" fill="#7A5044"/>
  <ellipse cx="142" cy="108" rx="7" ry="9" fill="#7A5044"/>
  <!-- Eyes -->
  <ellipse cx="84" cy="100" rx="7" ry="5" fill="white"/>
  <ellipse cx="116" cy="100" rx="7" ry="5" fill="white"/>
  <circle cx="85" cy="100" r="4" fill="#1a0614"/>
  <circle cx="117" cy="100" r="4" fill="#1a0614"/>
  <circle cx="86" cy="99" r="1.5" fill="white"/>
  <circle cx="118" cy="99" r="1.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M77 93 Q84 90 91 93" fill="none" stroke="#1a0614" stroke-width="2" stroke-linecap="round"/>
  <path d="M109 93 Q116 90 123 93" fill="none" stroke="#1a0614" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="112" rx="5" ry="4" fill="#6a4038"/>
  <!-- Smile -->
  <path d="M87 122 Q100 132 113 122" fill="none" stroke="#4a2820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gold ring accent -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#C9A84C" stroke-width="3" stroke-dasharray="8,4"/>
</svg>
