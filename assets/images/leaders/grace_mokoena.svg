<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8a6e28"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Shoulders / blouse -->
  <ellipse cx="100" cy="210" rx="85" ry="55" fill="#5C1A47"/>
  <rect x="38" y="160" width="124" height="55" fill="#5C1A47"/>
  <!-- Neck -->
  <rect x="85" y="132" width="30" height="32" rx="4" fill="#7A5044"/>
  <!-- Head -->
  <ellipse cx="100" cy="107" rx="42" ry="48" fill="#7A5044"/>
  <!-- Ears -->
  <ellipse cx="58" cy="110" rx="7" ry="9" fill="#7A5044"/>
  <ellipse cx="142" cy="110" rx="7" ry="9" fill="#7A5044"/>
  <!-- Earrings -->
  <circle cx="58" cy="120" r="4" fill="#C9A84C" stroke="#fff" stroke-width="1"/>
  <circle cx="142" cy="120" r="4" fill="#C9A84C" stroke="#fff" stroke-width="1"/>
  <!-- Natural hair / head wrap suggestion -->
  <ellipse cx="100" cy="68" rx="46" ry="22" fill="#1a0614"/>
  <!-- Head wrap accent -->
  <path d="M54 70 Q100 48 146 70" fill="#C9A84C" opacity="0.6"/>
  <!-- Eyes -->
  <ellipse cx="84" cy="103" rx="7" ry="5" fill="white"/>
  <ellipse cx="116" cy="103" rx="7" ry="5" fill="white"/>
  <circle cx="85" cy="103" r="4" fill="#1a0614"/>
  <circle cx="117" cy="103" r="4" fill="#1a0614"/>
  <circle cx="86" cy="102" r="1.5" fill="white"/>
  <circle cx="118" cy="102" r="1.5" fill="white"/>
  <!-- Lashes -->
  <path d="M77 98 Q84 95 91 98" fill="none" stroke="#1a0614" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M109 98 Q116 95 123 98" fill="none" stroke="#1a0614" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="115" rx="5" ry="4" fill="#6a4038"/>
  <!-- Warm smile -->
  <path d="M86 126 Q100 138 114 126" fill="none" stroke="#4a2820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lip colour -->
  <path d="M88 125 Q100 133 112 125" fill="#8a3030" opacity="0.5"/>
  <!-- Gold ring accent -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#3D0C2F" stroke-width="3" stroke-dasharray="8,4"/>
</svg>
