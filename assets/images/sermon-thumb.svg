<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="60%" stop-color="#3D0C2F"/>
      <stop offset="100%" stop-color="#5C1A47"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Ambient glow circles -->
  <circle cx="320" cy="180" r="200" fill="url(#glow)" filter="url(#blur)" opacity="0.5"/>
  <circle cx="320" cy="180" r="100" fill="#C9A84C" filter="url(#blur)" opacity="0.07"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="120" x2="640" y2="120" stroke="rgba(201,168,76,0.05)" stroke-width="1"/>
  <line x1="0" y1="240" x2="640" y2="240" stroke="rgba(201,168,76,0.05)" stroke-width="1"/>
  <line x1="213" y1="0" x2="213" y2="360" stroke="rgba(201,168,76,0.05)" stroke-width="1"/>
  <line x1="426" y1="0" x2="426" y2="360" stroke="rgba(201,168,76,0.05)" stroke-width="1"/>
  <!-- Open bible illustration -->
  <g transform="translate(220, 90)">
    <!-- Book spine -->
    <rect x="95" y="5" width="10" height="170" rx="2" fill="#8a6e28"/>
    <!-- Left page -->
    <path d="M95 10 Q40 15 20 30 L20 175 Q40 160 95 165 Z" fill="#f5f0e0" opacity="0.9"/>
    <!-- Right page -->
    <path d="M105 10 Q160 15 180 30 L180 175 Q160 160 105 165 Z" fill="#f0ebd5" opacity="0.9"/>
    <!-- Left page lines -->
    <line x1="30" y1="50" x2="90" y2="47" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="28" y1="62" x2="90" y2="59" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="27" y1="74" x2="90" y2="71" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="27" y1="86" x2="90" y2="84" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="27" y1="98" x2="90" y2="97" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="27" y1="110" x2="90" y2="110" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="28" y1="122" x2="90" y2="122" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="29" y1="134" x2="90" y2="135" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <!-- Right page lines -->
    <line x1="110" y1="47" x2="170" y2="50" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="59" x2="172" y2="62" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="71" x2="173" y2="74" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="84" x2="173" y2="86" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="97" x2="173" y2="98" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="110" x2="173" y2="110" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="122" x2="172" y2="122" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="135" x2="171" y2="134" stroke="#8a7a5a" stroke-width="1" opacity="0.4"/>
    <!-- Book cover shadow -->
    <rect x="95" y="165" width="10" height="8" rx="1" fill="#5a4a18"/>
  </g>
  <!-- Play button overlay -->
  <circle cx="320" cy="180" r="45" fill="rgba(0,0,0,0.5)" stroke="rgba(201,168,76,0.8)" stroke-width="3"/>
  <polygon points="308,162 308,198 348,180" fill="#C9A84C"/>
  <!-- Shammah Urban Church text -->
  <text x="320" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="rgba(201,168,76,0.9)" letter-spacing="3">SHAMMAH URBAN CHURCH</text>
  <text x="320" y="315" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1">Sunday Sermon Series</text>
  <!-- Decorative corner ornaments -->
  <path d="M20 20 L20 50 M20 20 L50 20" stroke="rgba(201,168,76,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M620 20 L620 50 M620 20 L590 20" stroke="rgba(201,168,76,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M20 340 L20 310 M20 340 L50 340" stroke="rgba(201,168,76,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M620 340 L620 310 M620 340 L590 340" stroke="rgba(201,168,76,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
