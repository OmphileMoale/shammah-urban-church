<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#3D0C2F"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1840"/>
      <stop offset="100%" stop-color="#2a0820"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0a1a"/>
      <stop offset="100%" stop-color="#0d0410"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Sky background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="100" cy="40" r="1" fill="white" opacity="0.7"/>
  <circle cx="200" cy="20" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="350" cy="35" r="1" fill="white" opacity="0.8"/>
  <circle cx="500" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="650" cy="50" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="720" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="80" cy="80" r="1" fill="white" opacity="0.5"/>
  <circle cx="600" cy="80" r="1" fill="white" opacity="0.6"/>
  <!-- Ground -->
  <rect x="0" y="420" width="800" height="80" fill="url(#ground)"/>
  <!-- Side wings -->
  <rect x="60" y="280" width="130" height="140" rx="4" fill="#2a0820"/>
  <rect x="610" y="280" width="130" height="140" rx="4" fill="#2a0820"/>
  <!-- Wing windows -->
  <rect x="85" y="305" width="35" height="50" rx="17" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <line x1="102" y1="305" x2="102" y2="355" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <line x1="85" y1="330" x2="120" y2="330" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <rect x="130" y="305" width="35" height="50" rx="17" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <line x1="147" y1="305" x2="147" y2="355" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <line x1="130" y1="330" x2="165" y2="330" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <rect x="635" y="305" width="35" height="50" rx="17" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <line x1="652" y1="305" x2="652" y2="355" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <line x1="635" y1="330" x2="670" y2="330" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <rect x="680" y="305" width="35" height="50" rx="17" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <line x1="697" y1="305" x2="697" y2="355" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <line x1="680" y1="330" x2="715" y2="330" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <!-- Main building body -->
  <rect x="150" y="200" width="500" height="220" rx="6" fill="url(#wall)"/>
  <!-- Roof gable -->
  <polygon points="120,202 400,70 680,202" fill="#5C1A47"/>
  <polygon points="118,202 400,68 682,202" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="2"/>
  <!-- Bell tower / steeple base -->
  <rect x="355" y="30" width="90" height="150" rx="4" fill="#3D0C2F"/>
  <!-- Steeple point -->
  <polygon points="355,32 400,0 445,32" fill="#5C1A47"/>
  <!-- Cross on steeple -->
  <rect x="396" y="5" width="8" height="30" rx="3" fill="#C9A84C" filter="url(#glow)"/>
  <rect x="384" y="15" width="32" height="7" rx="3" fill="#C9A84C" filter="url(#glow)"/>
  <!-- Steeple windows -->
  <rect x="370" y="65" width="28" height="40" rx="14" fill="rgba(201,168,76,0.25)" stroke="rgba(201,168,76,0.6)" stroke-width="1.5"/>
  <rect x="402" y="65" width="28" height="40" rx="14" fill="rgba(201,168,76,0.25)" stroke="rgba(201,168,76,0.6)" stroke-width="1.5"/>
  <!-- Main entrance arch -->
  <rect x="330" y="310" width="140" height="110" rx="70 70 0 0" fill="#1a0614"/>
  <rect x="333" y="312" width="134" height="106" rx="67 67 0 0" fill="rgba(201,168,76,0.12)" stroke="rgba(201,168,76,0.6)" stroke-width="2"/>
  <!-- Door handle -->
  <circle cx="393" cy="385" r="5" fill="rgba(201,168,76,0.8)"/>
  <circle cx="407" cy="385" r="5" fill="rgba(201,168,76,0.8)"/>
  <!-- Main windows row -->
  <rect x="175" y="235" width="55" height="80" rx="27" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="2"/>
  <line x1="202" y1="235" x2="202" y2="315" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <line x1="175" y1="275" x2="230" y2="275" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <rect x="245" y="235" width="55" height="80" rx="27" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="2"/>
  <line x1="272" y1="235" x2="272" y2="315" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <line x1="245" y1="275" x2="300" y2="275" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <rect x="500" y="235" width="55" height="80" rx="27" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="2"/>
  <line x1="527" y1="235" x2="527" y2="315" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <line x1="500" y1="275" x2="555" y2="275" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <rect x="570" y="235" width="55" height="80" rx="27" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="2"/>
  <line x1="597" y1="235" x2="597" y2="315" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <line x1="570" y1="275" x2="625" y2="275" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
  <!-- Circular rose window -->
  <circle cx="400" cy="170" r="48" fill="rgba(201,168,76,0.1)" stroke="rgba(201,168,76,0.6)" stroke-width="2"/>
  <circle cx="400" cy="170" r="36" fill="none" stroke="rgba(201,168,76,0.4)" stroke-width="1"/>
  <circle cx="400" cy="170" r="20" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <line x1="352" y1="170" x2="448" y2="170" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <line x1="400" y1="122" x2="400" y2="218" stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
  <line x1="366" y1="136" x2="434" y2="204" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>
  <line x1="434" y1="136" x2="366" y2="204" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>
  <!-- Church name -->
  <text x="400" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="rgba(201,168,76,0.85)" font-family="Georgia,serif" letter-spacing="4">SHAMMAH URBAN CHURCH</text>
  <!-- Ground line / steps -->
  <rect x="100" y="418" width="600" height="6" rx="3" fill="rgba(201,168,76,0.2)"/>
  <rect x="150" y="412" width="500" height="8" rx="2" fill="rgba(201,168,76,0.12)"/>
  <rect x="200" y="406" width="400" height="8" rx="2" fill="rgba(201,168,76,0.08)"/>
  <!-- Lamposts -->
  <rect x="218" y="350" width="5" height="70" rx="2" fill="rgba(201,168,76,0.5)"/>
  <circle cx="220" cy="348" r="6" fill="rgba(201,168,76,0.3)"/>
  <circle cx="220" cy="348" r="3" fill="rgba(201,168,76,0.9)" filter="url(#glow)"/>
  <rect x="577" y="350" width="5" height="70" rx="2" fill="rgba(201,168,76,0.5)"/>
  <circle cx="580" cy="348" r="6" fill="rgba(201,168,76,0.3)"/>
  <circle cx="580" cy="348" r="3" fill="rgba(201,168,76,0.9)" filter="url(#glow)"/>
  <!-- Sign board -->
  <rect x="295" y="400" width="210" height="22" rx="3" fill="#2a0820" stroke="rgba(201,168,76,0.4)" stroke-width="1"/>
  <text x="400" y="415" text-anchor="middle" font-size="9" fill="rgba(201,168,76,0.75)" font-family="Georgia,serif" letter-spacing="1">14 Jacaranda St · Sunnyside, Pretoria</text>
</svg>
